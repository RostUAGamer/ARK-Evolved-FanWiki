name: Build and Attach Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Copy & Rename APK
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v1.1.0"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/ARK-Evolved-FanWiki-${TAG_NAME}.apk"

      - name: Upload APK Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ github.event.release.id != '' }}
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: build/app/outputs/flutter-apk/ARK-Evolved-FanWiki-*.apk
