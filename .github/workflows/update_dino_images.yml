name: Update and Verify Dinosaur Images

on:
  workflow_dispatch: # Дозволяє запускати вручну з вкладки Actions на GitHub
  schedule:
    - cron: '0 4 * * 1' # Запуск щопонеділка о 04:00 UTC для перевірки актуальності картинок

permissions:
  contents: write

jobs:
  verify_and_update_images:
    name: Verify & Update Dino Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check and Update Dinosaur Image URLs
        run: python scripts/update_and_verify_images.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Widget & Smoke Tests
        run: flutter test

      - name: Commit and Push Updated Image URLs (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/data/
          if ! git diff --staged --quiet; then
            echo "Знайдено оновлені посилання на картинки, зберігаємо до репозиторію..."
            git commit -m "chore: auto-update and verify dinosaur image URLs [skip ci]"
            git push
          else
            echo "Усі посилання на зображення актуальні та валідні, коміт не потрібен."
          fi
